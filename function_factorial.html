<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Факторіал Завдання 2</title>
</head>
<style type="text/css">
    body {
        background-color: #4e4e4e;
        color: #cccccc;
        font-size: 30px;
    }
</style>
<body>
<a class="button-link" href="index.html">Повернутися до початку</a>
<script>
  function factorial() {
    let n = document.fctrl.n.value;
    let f=1;
    let res_f = document.getElementById("res_f");

    for (i=1; i<=n; i++) {
      f=f*i;
    }

    string=`Факторіал числа ${n} = ${f}`
    res_f.innerHTML = string;
  }
</script>
<div>
  <p>Розрахунок факторіалу числа n</p>
  <form name="fctrl" action="javascript:factorial()">
    n <input class="cqe" name="n" type="number" value="0" size="4">
    <input class="btn" type="submit" value="Розрахувати">
    <input class="btn" type="reset" name="reset" value="Скинути">
  </form>
  <span id="res_f">Введіть факторіал числа n</span>
</div>
</body>
</html>
